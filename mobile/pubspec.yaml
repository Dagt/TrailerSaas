name: trailersaas_mobile
description: "TrailerSaaS mobile foundation for Road and Yard modes."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.6"

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  sqlite3: ^3.7.0
  path_provider: ^2.1.6
  sentry_flutter: 9.30.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  mobile_scanner: 7.4.2
  http: ^1.6.0
  crypto: ^3.0.7
  connectivity_plus: ^7.3.2
  image_picker: 1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
