spring:
  application:
    name: trailersaas-backend
  main:
    banner-mode: off
  mvc:
    problemdetails:
      enabled: true
  profiles:
    default: local
  datasource:
    url: ${DB_RUNTIME_JDBC_URL}
    username: ${DB_RUNTIME_USERNAME}
    password: ${DB_RUNTIME_PASSWORD}
  flyway:
    url: ${DB_MIGRATION_JDBC_URL:${DB_RUNTIME_JDBC_URL}}
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}
    locations: classpath:db/migration
    validate-migration-naming: true
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
    placeholders:
      runtimeRole: ${DB_RUNTIME_USERNAME}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  tracing:
    export:
      enabled: false
    baggage:
      enabled: false
  logging:
    export:
      otlp:
        enabled: false

logging:
  structured:
    format:
      console: logstash
  level:
    org.springframework.web: WARN

trailersaas:
  cors:
    allowed-origins: ${WEB_ALLOWED_ORIGINS:}
  firebase:
    project-id: ${FIREBASE_PROJECT_ID}
