spring:
  application:
    name: trailersaas-backend
  datasource:
    url: ${DB_RUNTIME_JDBC_URL}
    username: ${DB_RUNTIME_USERNAME}
    password: ${DB_RUNTIME_PASSWORD}
  flyway:
    url: ${DB_MIGRATION_JDBC_URL:${DB_RUNTIME_JDBC_URL}}
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}
    locations: classpath:db/migration
    validate-migration-naming: true
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
