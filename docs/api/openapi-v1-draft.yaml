    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: documentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Documents]
      operationId: linkDocument
      x-implementation-status: implemented-issue-52
