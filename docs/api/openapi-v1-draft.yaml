  /api/v1/tenants/{tenantId}/documents/{documentId}/upload-completion:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: documentId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Documents]
      operationId: completeDocumentUpload
      x-implementation-status: implemented-issue-52
      description: >-
        Requires uploader identity, fresh POD_UPLOAD and active own Driver, including on replay.
        Existing links must remain fully authorized before returning finalized metadata or ledger replay.
        Copies the temporary object to a new private publication key, verifies actual bytes,
        size, content type and SHA-256, and atomically commits UPLOADED and the existing ledger
        result. A reusable old PUT cannot modify published bytes. Missing object gives
        409 UPLOAD_NOT_COMPLETE; incompatible content gives 409 UPLOAD_CONTENT_MISMATCH;
        incompatible UUID reuse gives 409 IDEMPOTENCY_KEY_REUSED. Infrastructure gives safe 503
