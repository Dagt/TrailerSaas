    get:
      tags: [Alerts]
      operationId: listAlerts
      x-implementation-status: implemented-issue-56
      description: >-
        Fresh Firebase User, ACTIVE membership and ACTIVE Tenant, ALERT_VIEW and
        related Trailer/Customer scope on every request. Conservative approved
        readers are Tenant Admin and Transport Operations. Closed query fields;
        bounded keyset cursor is a position, never authority. Only implemented
        TRAILER_MISSING and STALE_TRAILER occurrences with provisional WARNING.
        STALE origin/recovery may be SYSTEM; original detection evidence is immutable.
        Push acceptance is not phone delivery. No production recipient policy is enabled.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED] } }
        - { name: alertType, in: query, schema: { type: string, enum: [TRAILER_MISSING, STALE_TRAILER] } }
        - { name: severity, in: query, schema: { type: string, enum: [WARNING] } }
