    post:
      tags: [Documents]
      operationId: createDocumentDownloadUrl
      x-implementation-status: implemented-issue-52
      description: >-
        Fresh document/resource read authorization on every call. UPLOADED and at least one
        valid linked resource required; uploader identity alone is insufficient. Scoped readers
        must see all linked work and every Customer served by shared Stops. An issued GET URL
        is a temporary bearer grant (default 60 seconds, configured maximum 300); permission
        revocation cannot revoke an already-issued URL. Never log or share signed URLs.
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: {} }
      responses:
        '200':
          description: Short-lived private signed GET URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentDownloadImplemented' }
        default: { $ref: '#/components/responses/Problem' }

