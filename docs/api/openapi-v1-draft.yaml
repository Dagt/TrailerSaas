        acknowledgedAt: { type: [string, 'null'], format: date-time }
        resolvedBy: { type: [string, 'null'], format: uuid }
        resolvedAt: { type: [string, 'null'], format: date-time }
        resolutionReason: { type: [string, 'null'], maxLength: 4000 }
        originActorType: { type: string, enum: [HUMAN_USER, SYSTEM] }
        resolutionActorType: { type: [string, 'null'], enum: [HUMAN_USER, SYSTEM, null] }
        detection:
          description: Immutable authorized STALE evidence; null for TRAILER_MISSING. Elapsed time is calculated by the server at detection, not from browser clock.
          type: [object, 'null']
          additionalProperties: false
          required: [detectedAt, lastSeenAt, thresholdHours, elapsedHours, jobId]
          properties:
            detectedAt: { type: string, format: date-time }
            lastSeenAt: { type: string, format: date-time }
            thresholdHours: { type: integer, minimum: 1, maximum: 2147483647 }
            elapsedHours: { type: number, minimum: 0 }
            jobId: { type: string, format: uuid }
        resolutionEvidence:
          description: Current physical observation and threshold used by SYSTEM stale recovery; null for human resolution. resolvedBy remains null for SYSTEM, never a fictitious User.
          type: [object, 'null']
          additionalProperties: false
          required: [lastSeenAt, thresholdHours, jobId]
          properties:
            lastSeenAt: { type: string, format: date-time }
            thresholdHours: { type: integer, minimum: 1, maximum: 2147483647 }
            jobId: { type: string, format: uuid }
        relatedEntityType: { type: string, const: TRAILER }
        relatedResource:
          type: object
          additionalProperties: false
          required: [id, operationalNumber, designatedCustomerId, locationState, currentLocationId]
          properties:
            id: { type: string, format: uuid }
            operationalNumber: { type: string }
            designatedCustomerId: { type: [string, 'null'], format: uuid }
            locationState: { type: string, enum: [AT_LOCATION, IN_TRANSIT, LOCATION_UNKNOWN] }
            currentLocationId: { type: [string, 'null'], format: uuid }
        context:
          type: object
          additionalProperties: false
          properties:
            yardCheckId: { type: string, format: uuid }
            itemId: { type: string, format: uuid }
            movementEventId: { type: string, format: uuid }
        pushSummary:
          description: >-
            Counts of authorized recipient diagnostic states. ACCEPTED_BY_FCM is
            provider acceptance only, not device delivery. DEAD reflects durable-job
            exhaustion/permanent failure while preserving per-device attempt history.
          type: object
          propertyNames:
            enum: [PENDING, ATTEMPTED, ACCEPTED_BY_FCM, RETRYABLE_FAILURE, PERMANENT_FAILURE, INVALIDATED_TOKEN, SUPPRESSED_AUTHORIZATION, ALERT_INELIGIBLE, NO_ELIGIBLE_DEVICE, PARTIAL_FAILURE, DEAD]
          additionalProperties: { type: integer, minimum: 0 }
