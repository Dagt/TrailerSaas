      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        newCustomerId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, pattern: '\S' }

    HookTrailerRequest:
      type: object
      additionalProperties: false
      required: [trailerId, tractorId, driverId, occurredAt, expectedTrailerVersion]
      properties:
        trailerId: { type: string, format: uuid }
        tractorId: { type: string, format: uuid }
        driverId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        expectedTrailerVersion: { type: integer, format: int64, minimum: 0 }

    DropTrailerRequest:
      type: object
      additionalProperties: false
      required: [trailerId, stopId, locationId, occurredAt]
      properties:
        trailerId: { type: string, format: uuid }
        stopId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }

    TrailerCouplingCommandResult:
      type: object
      additionalProperties: false
      required: [coupling, trailer, trip, movementEvent]
      description: >-
        Authoritative bounded snapshot at the original command commit, retained for successful
        replay. No Tenant or ledger metadata. Read reconciliation is required for later state.
      properties:
        coupling:
          type: object
          additionalProperties: false
          required: [id, trailerId, tractorId, driverId, tripId, hookedAt, droppedAt]
          properties:
            id: { type: string, format: uuid }
            trailerId: { type: string, format: uuid }
            tractorId: { type: string, format: uuid }
            driverId: { type: string, format: uuid }
            tripId: { type: string, format: uuid }
            hookedAt: { type: string, format: date-time }
            droppedAt: { type: [string, "null"], format: date-time }
        trailer:
          type: object
          additionalProperties: false
          required: [id, version, locationState, currentLocationId, lastKnownLocationId, lastSeenAt, lastDriverId, loadState, serviceabilityState]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer, format: int64, minimum: 0 }
            locationState:
              $ref: '#/components/schemas/TrailerLocationState'
            currentLocationId: { type: [string, "null"], format: uuid }
            lastKnownLocationId: { type: [string, "null"], format: uuid }
            lastSeenAt: { type: string, format: date-time }
            lastDriverId: { type: string, format: uuid }
            loadState:
              $ref: '#/components/schemas/TrailerLoadState'
            serviceabilityState:
              $ref: '#/components/schemas/TrailerServiceabilityState'
        trip:
          type: object
          additionalProperties: false
          required: [id, status, version, currentDriverId, currentTractorId, plannedInitialTrailerId]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [PLANNED, ASSIGNED, IN_TRANSIT, AT_STOP, CANCELLING, COMPLETED, CANCELLED] }
            version: { type: integer, format: int64, minimum: 0 }
            currentDriverId: { type: [string, "null"], format: uuid }
            currentTractorId: { type: [string, "null"], format: uuid }
            plannedInitialTrailerId: { type: [string, "null"], format: uuid }
        movementEvent:
          type: object
          additionalProperties: false
          required: [id, eventType, occurredAt, recordedAt]
          properties:
            id: { type: string, format: uuid }
            eventType: { type: string, enum: [HOOKED, DROPPED] }
            occurredAt: { type: string, format: date-time }
            recordedAt: { type: string, format: date-time }

    ArrivalRequest:
      type: object
      required: [occurredAt, source]
      properties:
        occurredAt: { type: string, format: date-time }
        source:
          type: string
          enum: [MANUAL, GEOFENCE_CONFIRMED]
        coordinates:
          type: [object, "null"]
          properties:
            latitude: { type: number }
            longitude: { type: number }
            accuracyM: { type: number }

    DeliveryCompletionRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [evidenceMode, bolDocumentId, occurredAt]
          properties:
            evidenceMode:
              type: string
              const: SIGNED_BOL
            bolDocumentId: { type: string, format: uuid }
            occurredAt: { type: string, format: date-time }
        - type: object
          additionalProperties: false
          required: [evidenceMode, bolDocumentId, deliveryPhotoDocumentId, comment, occurredAt]
          properties:
            evidenceMode:
              type: string
              const: NO_RECEIVER_AVAILABLE
            bolDocumentId: { type: string, format: uuid }
            deliveryPhotoDocumentId: { type: string, format: uuid }
            comment: { type: string, minLength: 1, maxLength: 4000, description: Unicode whitespace-only text is rejected. }
            occurredAt: { type: string, format: date-time }

    DeliveryCompletionResultImplemented:
      type: object
      additionalProperties: false
      required: [stopId, tripId, stopStatus, tripStatus, stopVersion, tripVersion, completedAt]
      properties:
        stopId: { type: string, format: uuid }
        tripId: { type: string, format: uuid }
        stopStatus: { type: string, enum: [COMPLETED] }
        tripStatus: { type: string, enum: [AT_STOP, COMPLETED] }
        stopVersion: { type: integer, format: int64, minimum: 1 }
        tripVersion: { type: integer, format: int64, minimum: 1 }
        completedAt: { type: string, format: date-time }

    FuelEventRequestImplemented:
      type: object
      additionalProperties: false
      required: [tripId, tractorId, odometer, receiptDocumentId, occurredAt]
      properties:
        tripId: { type: string, format: uuid }
        tractorId: { type: string, format: uuid }
        odometer: { type: number, minimum: 0, maximum: 1000000000000, multipleOf: 0.001 }
        receiptDocumentId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }

    FuelEventResultImplemented:
      type: object
      additionalProperties: false
      required: [id, tripId, tractorId, odometer, receiptDocumentId, occurredAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        tripId: { type: string, format: uuid }
        tractorId: { type: string, format: uuid }
        odometer: { type: number }
        receiptDocumentId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    OperationalExceptionRequestImplemented:
      type: object
      additionalProperties: false
      required: [category, comment, occurredAt]
      properties:
        stopId: { type: [string, "null"], format: uuid }
        category: { type: string, enum: [DELAY_TRAFFIC, EQUIPMENT_DAMAGE, DESTINATION_CUSTOMER_ISSUE, LOAD_REJECTED, OTHER] }
        comment: { type: string, minLength: 1, maxLength: 4000 }
        documentIds:
          type: array
          maxItems: 50
          uniqueItems: true
          items: { type: string, format: uuid }
          description: Finalized DAMAGE_PHOTO IDs; at least one required for EQUIPMENT_DAMAGE. No client status fields.
        occurredAt: { type: string, format: date-time }

    OperationalExceptionResultImplemented:
      type: object
      additionalProperties: false
      required: [id, tripId, stopId, category, comment, documentIds, occurredAt, recordedAt]
      properties:
        id: { type: string, format: uuid }
        tripId: { type: string, format: uuid }
        stopId: { type: [string, "null"], format: uuid }
        category: { type: string, enum: [DELAY_TRAFFIC, EQUIPMENT_DAMAGE, DESTINATION_CUSTOMER_ISSUE, LOAD_REJECTED, OTHER] }
        comment: { type: string }
        documentIds:
          type: array
          items: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }

    StartYardCheckRequest:
      type: object
      additionalProperties: false
      required: [siteId]
      properties:
        siteId: { type: string, format: uuid }
        locationId: { type: [string, "null"], format: uuid }

    YardCheckScanRequest:
      type: object
      additionalProperties: false
      required: [trailerId, observedLocationId, scannedAt]
      properties:
        trailerId: { type: string, format: uuid }
        observedLocationId: { type: string, format: uuid }
