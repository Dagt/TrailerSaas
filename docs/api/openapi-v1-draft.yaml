        newSiteId: { type: string, format: uuid }
        newLocationId: { type: [string, "null"], format: uuid }
        scheduledAt: { type: [string, "null"], format: date-time }
        reason: { type: string, minLength: 1, pattern: '\S' }
        instructions: { type: string, minLength: 1, pattern: '\S' }

    TripCancellationResolutionTypeImplemented:
      type: string
      enum: [RETURN_TO_BASE, REROUTE, HOLD_CONTACT_DISPATCH, OTHER_AUTHORIZED]

    CancelTripRequestImplemented:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      description: >
        Active cancellation requires resolutionType and nonblank instructions. RETURN_TO_BASE/REROUTE
        require destinationSiteId; HOLD_CONTACT_DISPATCH forbids it; OTHER_AUTHORIZED permits it.
        REROUTE destination must serve all mapped Customers; base/other destination must be same Tenant.
        Before movement resolution is optional. No client actor or occurrence time.
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 1, pattern: '\S' }
        resolutionType:
          anyOf:
            - $ref: '#/components/schemas/TripCancellationResolutionTypeImplemented'
            - type: "null"
        destinationSiteId: { type: [string, "null"], format: uuid }
        instructions: { type: [string, "null"], minLength: 1, pattern: '\S' }

    TripDestinationInstructionImplemented:
      type: object
      additionalProperties: false
      properties:
        siteId: { type: [string, "null"], format: uuid }
        locationId: { type: [string, "null"], format: uuid }
        siteSnapshot:
          anyOf:
            - $ref: '#/components/schemas/OrderDestinationSnapshot'
            - type: "null"
        scheduledAt: { type: [string, "null"], format: date-time }
        instructions: { type: [string, "null"] }
        status:
          $ref: '#/components/schemas/ExecutableStopStatusImplemented'
        version: { type: integer, format: int64, minimum: 0 }

    TripOperationalEventImplemented:
      type: object
