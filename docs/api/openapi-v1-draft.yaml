        links per document. This is attachment infrastructure, not evidence approval/completion #53.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentLinkRequestImplemented' }
      responses:
        '200':
          description: Existing or created authorized attachment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentLinkImplemented' }
        default: { $ref: '#/components/responses/Problem' }

