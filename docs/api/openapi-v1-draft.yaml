      operationId: scanYardCheckTrailer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YardCheckScanRequest'
      responses:
        '200':
          description: Scan result
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/documents/uploads:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [Documents]
      operationId: initializeDocumentUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitializeUploadRequest'
      responses:
        '201':
          description: Upload initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitializeUploadResponse'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/alerts:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Alerts]
      operationId: listAlerts
      responses:
        '200':
          $ref: '#/components/responses/PagedResponse'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/audit-events:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Audit]
      operationId: listAuditEvents
      responses:
        '200':
          $ref: '#/components/responses/PagedResponse'
        default:
          $ref: '#/components/responses/Problem'

components:
  securitySchemes:
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      description: Requested Tenant context; membership is always re-authorized server-side.
      schema: { type: string, format: uuid }
    CustomerId:
      name: customerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SiteId:
      name: siteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LocationId:
      name: locationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TripId:
      name: tripId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StopId:
      name: stopId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: Error response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PagedResponse:
      description: Cursor-paginated response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PagedResponse'

  schemas:
    Problem:
      type: object
      required: [title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        traceId: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    PagedResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type: [string, "null"]

    CurrentUserContext:
      type: object
      required: [userId, email, displayName, memberships]
      properties:
        userId: { type: string, format: uuid }
        email: { type: [string, "null"] }
        displayName: { type: [string, "null"] }
        memberships:
          type: array
          items:
            type: object
            required: [tenantId, tenantName, status, roles]
            properties:
              tenantId: { type: string, format: uuid }
              tenantName: { type: string }
              status:
                type: string
                enum: [ACTIVE, SUSPENDED, DISABLED]
              roles:
                type: array
                items:
                  type: object
                  required: [roleCode, scopeType, customerId]
                  properties:
                    roleCode:
                      type: string
                      enum: [TENANT_ADMIN, TRANSPORT_OPERATIONS, CUSTOMER_DISPATCHER, YARD_SPOTTER, DRIVER]
                    scopeType:
                      type: string
                      enum: [TENANT, CUSTOMER]
                    customerId: { type: [string, "null"], format: uuid }

    InvitationStatus:
      type: string
      enum: [PENDING, ACCEPTED, EXPIRED, REVOKED]

    InvitationRole:
      type: object
      additionalProperties: false
      required: [roleCode, scopeType]
      description: CUSTOMER_DISPATCHER requires CUSTOMER/non-null customerId; all other roles require TENANT/null customerId. Duplicate intended assignments rejected.
      properties:
        roleCode:
          type: string
          enum: [TENANT_ADMIN, TRANSPORT_OPERATIONS, CUSTOMER_DISPATCHER, YARD_SPOTTER, DRIVER]
        scopeType:
          type: string
          enum: [TENANT, CUSTOMER]
        customerId: { type: [string, "null"], format: uuid }

    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, roles]
      properties:
        email: { type: string, description: 'Original display email; normalized with trim and whole-email lowercase, without provider aliases' }
        displayName: { type: [string, "null"] }
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/InvitationRole' }

    InvitationSummary:
      type: object
      additionalProperties: false
      required: [id, email, displayName, status, expiresAt, roles]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: [string, "null"] }
        status: { $ref: '#/components/schemas/InvitationStatus' }
        expiresAt: { type: string, format: date-time }
        roles:
          type: array
          items: { $ref: '#/components/schemas/InvitationRole' }

    CreateInvitationResponse:
      type: object
      additionalProperties: false
      required: [id, email, displayName, status, expiresAt, roles, acceptanceToken]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: [string, "null"] }
        status: { $ref: '#/components/schemas/InvitationStatus' }
        expiresAt: { type: string, format: date-time }
        roles:
          type: array
          items: { $ref: '#/components/schemas/InvitationRole' }
        acceptanceToken:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: 32 random bytes encoded Base64 URL-safe without padding; returned only once at creation. Never in list/revoke or persisted.

    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Canonical unpadded Base64 URL-safe encoding of exactly 32 bytes. No Tenant/User/email/role hints accepted.

    InvitationAcceptanceResult:
      type: object
      additionalProperties: false
      required: [invitationId, tenantId, membershipId, accepted]
      properties:
        invitationId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        membershipId: { type: string, format: uuid }
        accepted: { type: boolean, const: true }

    TenantSettings:
      type: object
      additionalProperties: false
      required: [staleTrailerThresholdHours, defaultTimezone, version]
      properties:
        staleTrailerThresholdHours: { type: integer, format: int32, minimum: 1 }
        defaultTimezone: { type: [string, "null"], description: Valid IANA timezone when non-null }
        version: { type: integer, format: int64, minimum: 0 }

    UpdateTenantSettingsRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        staleTrailerThresholdHours: { type: integer, format: int32, minimum: 1 }
        defaultTimezone: { type: [string, "null"], description: Valid IANA timezone; explicit null clears it }

    CreateCustomerRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, description: Nonblank Customer name }

    UpdateCustomerRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        name: { type: string, minLength: 1 }
        status:
          type: string
          enum: [ACTIVE, INACTIVE]

    Customer:
      type: object
      required: [id, name, status, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CustomerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Customer' }

    SiteAddress:
      type: [object, "null"]
      properties:
        line1: { type: [string, "null"] }
        line2: { type: [string, "null"] }
        city: { type: [string, "null"] }
        stateRegion: { type: [string, "null"] }
        postalCode: { type: [string, "null"] }
        countryCode: { type: [string, "null"], minLength: 2, maxLength: 2 }

    CreateSiteRequest:
      type: object
      required: [name, timezone]
      properties:
        name: { type: string, minLength: 1 }
        address: { $ref: '#/components/schemas/SiteAddress' }
        timezone: { type: string, description: Valid IANA timezone }
        latitude: { type: [number, "null"], minimum: -90, maximum: 90 }
        longitude: { type: [number, "null"], minimum: -180, maximum: 180 }
        geofenceRadiusM: { type: [integer, "null"], minimum: 1, maximum: 2147483647 }

    UpdateSiteRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      description: Omitted fields remain unchanged; null clears nullable fields. Address object updates only provided subfields; null clears the whole address.
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        name: { type: string, minLength: 1 }
        address: { $ref: '#/components/schemas/SiteAddress' }
        timezone: { type: string, description: Valid IANA timezone }
        latitude: { type: [number, "null"], minimum: -90, maximum: 90 }
        longitude: { type: [number, "null"], minimum: -180, maximum: 180 }
        geofenceRadiusM: { type: [integer, "null"], minimum: 1, maximum: 2147483647 }
        active: { type: boolean }

    PhysicalSite:
      allOf:
        - $ref: '#/components/schemas/CreateSiteRequest'
        - type: object
          required: [id, active, version, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            active: { type: boolean }
            version: { type: integer, format: int64 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    PhysicalSiteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PhysicalSite' }

    AssociateCustomerSiteRequest:
      type: object
      required: [siteId]
      properties:
        siteId: { type: string, format: uuid }

    CustomerSite:
      type: object
      required: [id, customerId, siteId, createdAt]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    CreateOperationalLocationRequest:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1 }
        type: { type: string, enum: [BASE, YARD, DOCK, CUSTOMER_AREA, SHOP, OTHER] }
        code: { type: [string, "null"] }
        customerId: { type: [string, "null"], format: uuid }

    UpdateOperationalLocationRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      description: siteId is immutable. Null clears code/customerId; omitted fields stay unchanged.
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        name: { type: string, minLength: 1 }
        type: { type: string, enum: [BASE, YARD, DOCK, CUSTOMER_AREA, SHOP, OTHER] }
        code: { type: [string, "null"] }
        customerId: { type: [string, "null"], format: uuid }
        active: { type: boolean }

    OperationalLocation:
      allOf:
        - $ref: '#/components/schemas/CreateOperationalLocationRequest'
        - type: object
          required: [id, siteId, customerId, code, active, version, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            siteId: { type: string, format: uuid }
            active: { type: boolean }
            version: { type: integer, format: int64 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    OperationalLocationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OperationalLocation' }

    Driver:
      type: object
      additionalProperties: false
      required: [id, userId, name, licenseNumber, medicalCertificateExpires, active, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: [string, "null"], format: uuid }
        name: { type: string }
        licenseNumber: { type: [string, "null"] }
        medicalCertificateExpires: { type: [string, "null"], format: date }
        active: { type: boolean }
        version: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DriverList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Driver' }
    CreateDriverRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, pattern: '\S' }
        licenseNumber: { type: [string, "null"] }
        medicalCertificateExpires: { type: [string, "null"], format: date }
    UpdateDriverRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        name: { type: string, minLength: 1, pattern: '\S' }
        licenseNumber: { type: [string, "null"] }
        medicalCertificateExpires: { type: [string, "null"], format: date }
        active: { type: boolean }
    LinkDriverUserRequest:
      type: object
      additionalProperties: false
      required: [userId, expectedVersion]
      properties:
        userId: { type: string, format: uuid }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    UnlinkDriverUserRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    Tractor:
      type: object
      additionalProperties: false
      required: [id, operationalNumber, active, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        operationalNumber: { type: string }
        active: { type: boolean }
        version: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TractorList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Tractor' }
    CreateTractorRequest:
      type: object
      additionalProperties: false
      required: [operationalNumber]
      properties:
        operationalNumber:
          type: string
          minLength: 1
          pattern: '^[^\u0000-\u001f\u007f-\u009f]*[^ \u0000-\u001f\u007f-\u009f][^\u0000-\u001f\u007f-\u009f]*$'
          description: >
            Display preserved exactly. Rejects C0/C1 controls and all-ASCII-space values.
            Uniqueness uses ASCII-space trim/collapse and ASCII a-z to A-Z only;
            punctuation, leading zeros, separators and non-ASCII are preserved.
    UpdateTractorRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        operationalNumber:
          $ref: '#/components/schemas/CreateTractorRequest/properties/operationalNumber'
        active: { type: boolean }

    CreateOrderRequestImplemented:
      type: object
      additionalProperties: false
      required: [customerId, orderNumber, requestedStops]
      properties:
        customerId: { type: string, format: uuid }
        orderNumber: { type: string, pattern: '\S', minLength: 1 }
        poNumber: { type: [string, "null"] }
        shipmentNumber: { type: [string, "null"] }
        bolReference: { type: [string, "null"] }
        plannedTrailerId:
          type: [string, "null"]
          format: uuid
          description: >
            Optional initial Manifest planning. Requires TRIP_ASSIGN_TRAILER and fresh Trailer
            visibility in the same Tenant; Trailer must be active and IN_SERVICE. Creates an
            OPEN Manifest with a null-amount allocation atomically; Order remains OPEN.
        cargoLines:
          type: array
          description: Optional; omission or an empty array creates no cargo lines.
          items:
            $ref: '#/components/schemas/OrderCargoLineInputImplemented'
        requestedStops:
          type: array
          minItems: 1
          description: Unique sequenceNumber per Order; persisted independently of any Trip.
          items:
            $ref: '#/components/schemas/OrderRequestedStopInputImplemented'

    OrderCargoLineInputImplemented:
      type: object
      additionalProperties: false
      required: [description]
      properties:
        description: { type: string, pattern: '\S', minLength: 1 }
        quantity: { type: [number, "null"] }
        palletCount: { type: [integer, "null"] }
        weight: { type: [number, "null"] }
        weightUnit:
          type: [string, "null"]
          description: Open metadata string; no approved closed unit taxonomy or conversion.

    OrderRequestedStopInputImplemented:
      type: object
      additionalProperties: false
      required: [sequenceNumber, stopType]
      description: >
        Requires siteId or a valid snapshot (both may coexist). locationId requires siteId.
        Normalized Site must be associated with the Order Customer; Location belongs to
        that exact Tenant/Site and is neutral or belongs to that Customer.
      properties:
        sequenceNumber: { type: integer, minimum: 1 }
        siteId: { type: [string, "null"], format: uuid }
        locationId: { type: [string, "null"], format: uuid }
        siteSnapshot:
          anyOf:
            - $ref: '#/components/schemas/OrderDestinationSnapshot'
            - type: "null"
        stopType:
          type: string
          pattern: '\S'
          minLength: 1
          description: Requested Stop type; no executable Trip Stop enum is imposed by issue 31.
        scheduledAt: { type: [string, "null"], format: date-time }
        instructions: { type: [string, "null"] }

    OrderDestinationSnapshot:
      type: object
      additionalProperties: false
      required: [name]
      description: >
        Minimal destination representation from existing Site DTO fields. Frozen at creation;
        optional address/timezone/coordinates do not establish permissions or master data.
        No Tenant, Customer, Site, Location or authorization identifiers.
      properties:
        name: { type: string, pattern: '\S', minLength: 1 }
        address:
          anyOf:
            - type: object
              additionalProperties: false
              properties:
                line1: { type: [string, "null"] }
                line2: { type: [string, "null"] }
                city: { type: [string, "null"] }
                stateRegion: { type: [string, "null"] }
                postalCode: { type: [string, "null"] }
                countryCode: { type: [string, "null"], minLength: 2, maxLength: 2 }
            - type: "null"
        timezone:
          type: [string, "null"]
          description: IANA timezone when supplied.
        latitude: { type: [number, "null"], minimum: -90, maximum: 90 }
        longitude: { type: [number, "null"], minimum: -180, maximum: 180 }
        geofenceRadiusM: { type: [integer, "null"], minimum: 1 }

    OrderStatus:
      type: string
      enum: [OPEN, PLANNED, IN_PROGRESS, PARTIALLY_DELIVERED, DELIVERED, COMPLETED, CANCELLING, CANCELLED]
      description: Accepted full catalog; issue 31 creates only OPEN and implements no transitions.

    OrderList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummary'
        nextCursor:
          type: [string, "null"]
          description: Opaque continuation, null at end; never grants Tenant/customer access.

    OrderCargoLine:
      type: object
      additionalProperties: false
      required: [id, description, quantity, palletCount, weight, weightUnit, createdAt]
      properties:
        id: { type: string, format: uuid }
        description: { type: string, pattern: '\S', minLength: 1 }
        quantity: { type: [number, "null"] }
        palletCount: { type: [integer, "null"] }
        weight: { type: [number, "null"] }
        weightUnit:
          type: [string, "null"]
          description: Open metadata string; no approved closed unit taxonomy or conversion.
        createdAt: { type: string, format: date-time }

    OrderRequestedStop:
      type: object
      additionalProperties: false
      required: [id, sequenceNumber, siteId, locationId, siteSnapshot, stopType, scheduledAt, instructions, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        sequenceNumber: { type: integer, minimum: 1 }
        siteId: { type: [string, "null"], format: uuid }
        locationId: { type: [string, "null"], format: uuid }
        siteSnapshot:
          anyOf:
            - $ref: '#/components/schemas/OrderDestinationSnapshot'
            - type: "null"
        stopType:
          type: string
          pattern: '\S'
          minLength: 1
          description: Requested Stop type; no executable Trip Stop enum is imposed by issue 31.
        scheduledAt: { type: [string, "null"], format: date-time }
        instructions: { type: [string, "null"] }
        version: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OrderDetail:
      type: object
      additionalProperties: false
      required: [id, customerId, orderNumber, poNumber, shipmentNumber, bolReference, status, version, createdAt, updatedAt, deliveredAt, completedAt, cancelledAt, cargoLines, requestedStops]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        orderNumber: { type: string }
        poNumber: { type: [string, "null"] }
        shipmentNumber: { type: [string, "null"] }
        bolReference: { type: [string, "null"] }
        status:
          $ref: '#/components/schemas/OrderStatus'
        version: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deliveredAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        cancelledAt: { type: [string, "null"], format: date-time }
        cargoLines:
          type: array
          items:
            $ref: '#/components/schemas/OrderCargoLine'
        requestedStops:
          type: array
          items:
            $ref: '#/components/schemas/OrderRequestedStop'


    CargoLineInput:
      type: object
      required: [description]
      properties:
        description: { type: string }
        quantity: { type: number }
        palletCount: { type: integer }
        weight: { type: number }
        weightUnit: { type: string }

    RequestedStopInput:
      type: object
      required: [sequenceNumber, stopType]
      properties:
        sequenceNumber: { type: integer, minimum: 1 }
        siteId: { type: [string, "null"], format: uuid }
        locationId: { type: [string, "null"], format: uuid }
        siteSnapshot: { type: [object, "null"] }
        stopType: { type: string }
        scheduledAt: { type: [string, "null"], format: date-time }
        instructions: { type: [string, "null"] }

    CreateOrderRequest:
      type: object
      description: Accepted broad contract; the strict implemented request is CreateOrderRequestImplemented.
      required: [customerId, orderNumber, requestedStops]
      properties:
        customerId: { type: string, format: uuid }
        orderNumber: { type: string }
        poNumber: { type: [string, "null"] }
        shipmentNumber: { type: [string, "null"] }
        bolReference: { type: [string, "null"] }
        cargoLines:
          type: array
          items:
            $ref: '#/components/schemas/CargoLineInput'
        requestedStops:
          type: array
