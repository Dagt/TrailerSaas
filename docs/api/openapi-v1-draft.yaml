    get:
      tags: [Documents]
      operationId: getDocumentMetadata
      x-implementation-status: implemented-issue-52
      description: >-
        Fresh DOCUMENT_VIEW_ALL or DOCUMENT_VIEW_CUSTOMER_SCOPED plus linked-resource scope;
