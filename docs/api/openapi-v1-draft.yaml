        and MovementRules.yard own the physical transition. An active IN_SERVICE,
        AT_LOCATION, UNCOUPLED Trailer and distinct active normalized from/to Locations
        in the same Site are mandatory. Customer areas require a live association.
        For a stationary compatible Trailer, wrong origin returns LOCATION_MISMATCH
