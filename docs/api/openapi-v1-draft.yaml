      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 1, pattern: '\S' }

    ChangeTrailerCustomerDesignationRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, newCustomerId, reason]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        newCustomerId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, pattern: '\S' }

    HookTrailerRequest:
      type: object
      additionalProperties: false
      required: [trailerId, tractorId, driverId, occurredAt, expectedTrailerVersion]
      properties:
        trailerId: { type: string, format: uuid }
        tractorId: { type: string, format: uuid }
        driverId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        expectedTrailerVersion: { type: integer, format: int64, minimum: 0 }

    DropTrailerRequest:
      type: object
      additionalProperties: false
      required: [trailerId, stopId, locationId, occurredAt]
      properties:
        trailerId: { type: string, format: uuid }
        stopId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }

    TrailerCouplingCommandResult:
      type: object
      additionalProperties: false
      required: [coupling, trailer, trip, movementEvent]
      description: >-
        Authoritative bounded snapshot at the original command commit, retained for successful
        replay. No Tenant or ledger metadata. Read reconciliation is required for later state.
      properties:
        coupling:
          type: object
          additionalProperties: false
          required: [id, trailerId, tractorId, driverId, tripId, hookedAt, droppedAt]
          properties:
            id: { type: string, format: uuid }
            trailerId: { type: string, format: uuid }
            tractorId: { type: string, format: uuid }
            driverId: { type: string, format: uuid }
            tripId: { type: string, format: uuid }
            hookedAt: { type: string, format: date-time }
            droppedAt: { type: [string, "null"], format: date-time }
        trailer:
          type: object
          additionalProperties: false
          required: [id, version, locationState, currentLocationId, lastKnownLocationId, lastSeenAt, lastDriverId, loadState, serviceabilityState]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer, format: int64, minimum: 0 }
            locationState:
              $ref: '#/components/schemas/TrailerLocationState'
            currentLocationId: { type: [string, "null"], format: uuid }
            lastKnownLocationId: { type: [string, "null"], format: uuid }
            lastSeenAt: { type: string, format: date-time }
            lastDriverId: { type: string, format: uuid }
            loadState:
              $ref: '#/components/schemas/TrailerLoadState'
            serviceabilityState:
              $ref: '#/components/schemas/TrailerServiceabilityState'
        trip:
          type: object
          additionalProperties: false
          required: [id, status, version, currentDriverId, currentTractorId, plannedInitialTrailerId]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [PLANNED, ASSIGNED, IN_TRANSIT, AT_STOP, CANCELLING, COMPLETED, CANCELLED] }
            version: { type: integer, format: int64, minimum: 0 }
            currentDriverId: { type: [string, "null"], format: uuid }
            currentTractorId: { type: [string, "null"], format: uuid }
            plannedInitialTrailerId: { type: [string, "null"], format: uuid }
        movementEvent:
          type: object
          additionalProperties: false
          required: [id, eventType, occurredAt, recordedAt]
          properties:
            id: { type: string, format: uuid }
            eventType: { type: string, enum: [HOOKED, DROPPED] }
            occurredAt: { type: string, format: date-time }
            recordedAt: { type: string, format: date-time }

    ArrivalRequest:
      type: object
      required: [occurredAt, source]
      properties:
        occurredAt: { type: string, format: date-time }
        source:
          type: string
          enum: [MANUAL, GEOFENCE_CONFIRMED]
        coordinates:
          type: [object, "null"]
          properties:
            latitude: { type: number }
            longitude: { type: number }
            accuracyM: { type: number }

    DeliveryCompletionRequest:
      oneOf:
        - type: object
          required: [evidenceMode, bolDocumentId, occurredAt]
          properties:
            evidenceMode:
              type: string
              const: SIGNED_BOL
            bolDocumentId: { type: string, format: uuid }
            occurredAt: { type: string, format: date-time }
        - type: object
          required: [evidenceMode, bolDocumentId, deliveryPhotoDocumentId, comment, occurredAt]
          properties:
            evidenceMode:
              type: string
              const: NO_RECEIVER_AVAILABLE
            bolDocumentId: { type: string, format: uuid }
            deliveryPhotoDocumentId: { type: string, format: uuid }
            comment: { type: string, minLength: 1 }
            occurredAt: { type: string, format: date-time }

    StartYardCheckRequest:
      type: object
      required: [siteId]
      properties:
        siteId: { type: string, format: uuid }
        locationId: { type: [string, "null"], format: uuid }

    YardCheckScanRequest:
      type: object
      required: [trailerId, scannedAt]
      properties:
        trailerId: { type: string, format: uuid }
        observedLocationId: { type: [string, "null"], format: uuid }
        scannedAt: { type: string, format: date-time }

    InitializeUploadRequest:
      type: object
      required: [documentType, contentType, sizeBytes]
      properties:
        documentType: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        checksumSha256: { type: [string, "null"] }

    InitializeUploadRequestImplemented:
      type: object
      additionalProperties: false
      required: [documentType, contentType, sizeBytes]
      properties:
        documentType:
          type: string
          enum: [BOL, POD, DELIVERY_PHOTO, PRETRIP_FRONT, PRETRIP_REAR, PRETRIP_DRIVER_SIDE, PRETRIP_PASSENGER_SIDE, DAMAGE_PHOTO, FUEL_RECEIPT]
          description: Only BOL/POD/DELIVERY_PHOTO currently have upload authority; others return 403.
        contentType:
          type: string
          enum: [image/jpeg, image/png, application/pdf]
          description: PDF only for BOL/POD; photos require JPEG/PNG. No content sniffing/evidence approval claim.
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 104857600
          description: Deployment bound defaults to 25 MiB; configurable up to 100 MiB. Exact bytes verified.
        checksumSha256:
          type: [string, "null"]
          pattern: '^[0-9a-fA-F]{64}$'

    InitializeUploadResponseImplemented:
      type: object
      additionalProperties: false
      required: [documentId, uploadStatus, uploadUrl, expiresAt]
      properties:
        documentId: { type: string, format: uuid }
        uploadStatus: { type: string, enum: [PENDING] }
        uploadUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }

    CompleteUploadRequestImplemented:
      type: object
      additionalProperties: false
      properties:
        checksumSha256: { type: [string, "null"], pattern: '^[0-9a-fA-F]{64}$' }

    DocumentLinkRequestImplemented:
      type: object
      additionalProperties: false
      required: [entityType, entityId]
      properties:
        entityType: { type: string, enum: [TRIP_STOP] }
        entityId: { type: string, format: uuid }

    DocumentLinkImplemented:
      type: object
      additionalProperties: false
      required: [id, entityType, entityId, createdAt]
      properties:
        id: { type: string, format: uuid }
        entityType: { type: string, enum: [TRIP_STOP] }
        entityId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    DocumentMetadataImplemented:
      type: object
      additionalProperties: false
      required: [id, documentType, contentType, sizeBytes, checksumSha256, uploadStatus, createdAt, uploadedAt, links]
      properties:
        id: { type: string, format: uuid }
        documentType:
          type: string
          enum: [BOL, POD, DELIVERY_PHOTO, PRETRIP_FRONT, PRETRIP_REAR, PRETRIP_DRIVER_SIDE, PRETRIP_PASSENGER_SIDE, DAMAGE_PHOTO, FUEL_RECEIPT]
        contentType: { type: [string, "null"] }
        sizeBytes: { type: [integer, "null"], format: int64 }
        checksumSha256: { type: [string, "null"] }
        uploadStatus: { type: string, enum: [PENDING, UPLOADED, FAILED, DELETED_BY_RETENTION] }
        createdAt: { type: string, format: date-time }
        uploadedAt: { type: [string, "null"], format: date-time }
        links:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/DocumentLinkImplemented' }

    DocumentDownloadImplemented:
      type: object
      additionalProperties: false
      required: [downloadUrl, expiresAt]
      properties:
        downloadUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }

    InitializeUploadResponse:
      type: object
      properties:
        documentId: { type: string, format: uuid }
        uploadStatus: { type: string }
        uploadUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
