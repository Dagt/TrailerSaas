      properties:
        expectedTrailerId: { type: string, format: uuid }
        requestedTrailerId: { type: string, format: uuid }
        decision: { type: string, enum: [AUTHORIZE, REJECT] }
        reason: { type: string, minLength: 1, pattern: '\S' }

    RerouteTripRequestImplemented:
      type: object
      additionalProperties: false
      required: [expectedVersion, affectedStopId, newSiteId, reason, instructions]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        affectedStopId: { type: string, format: uuid }
        newSiteId: { type: string, format: uuid }
        newLocationId: { type: [string, "null"], format: uuid }
        scheduledAt: { type: [string, "null"], format: date-time }
        reason: { type: string, minLength: 1, pattern: '\S' }
        instructions: { type: string, minLength: 1, pattern: '\S' }

    TripCancellationResolutionTypeImplemented:
      type: string
      enum: [RETURN_TO_BASE, REROUTE, HOLD_CONTACT_DISPATCH, OTHER_AUTHORIZED]

    CancelTripRequestImplemented:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      description: >
        Active cancellation requires resolutionType and nonblank instructions. RETURN_TO_BASE/REROUTE
        require destinationSiteId; HOLD_CONTACT_DISPATCH forbids it; OTHER_AUTHORIZED permits it.
        REROUTE destination must serve all mapped Customers; base/other destination must be same Tenant.
        Before movement resolution is optional. No client actor or occurrence time.
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 1, pattern: '\S' }
        resolutionType:
          anyOf:
            - $ref: '#/components/schemas/TripCancellationResolutionTypeImplemented'
            - type: "null"
        destinationSiteId: { type: [string, "null"], format: uuid }
        instructions: { type: [string, "null"], minLength: 1, pattern: '\S' }

    TripDestinationInstructionImplemented:
      type: object
      additionalProperties: false
      properties:
        siteId: { type: [string, "null"], format: uuid }
        locationId: { type: [string, "null"], format: uuid }
        siteSnapshot:
          anyOf:
            - $ref: '#/components/schemas/OrderDestinationSnapshot'
            - type: "null"
        scheduledAt: { type: [string, "null"], format: date-time }
        instructions: { type: [string, "null"] }
        status:
          $ref: '#/components/schemas/ExecutableStopStatusImplemented'
        version: { type: integer, format: int64, minimum: 0 }

    TripOperationalEventImplemented:
      type: object
      additionalProperties: false
      required: [id, eventType, tripStopId, actorUserId, targetDriverId, occurredAt, reason, metadata]
      properties:
        id: { type: string, format: uuid }
        eventType:
          type: string
          enum: [TRIP_REROUTED, TRIP_CANCELLED, TRIP_CANCELLATION_STARTED, TRIP_CANCELLATION_FINISHED]
        tripStopId: { type: [string, "null"], format: uuid }
        actorUserId: { type: [string, "null"], format: uuid }
        targetDriverId: { type: [string, "null"], format: uuid }
        occurredAt: { type: string, format: date-time }
        reason: { type: [string, "null"] }
        metadata:
          type: [object, "null"]
          additionalProperties: false
          properties:
            previous:
              $ref: '#/components/schemas/TripDestinationInstructionImplemented'
            replacement:
              $ref: '#/components/schemas/TripDestinationInstructionImplemented'
            previousState:
              $ref: '#/components/schemas/TripStatusImplemented'
            resolutionType:
              $ref: '#/components/schemas/TripCancellationResolutionTypeImplemented'
            destinationSiteId: { type: [string, "null"], format: uuid }
            instructions: { type: [string, "null"] }

    DriverUpdatePayloadImplemented:
      type: object
      additionalProperties: false
      required: [tripId, tripVersion]
      description: Bounded operational facts for this target Driver; no actor, role or Customer metadata.
      properties:
        tripId: { type: string, format: uuid }
        tripVersion: { type: integer, format: int64, minimum: 0 }
        status:
          $ref: '#/components/schemas/TripStatusImplemented'
        currentAssignment: { type: boolean }
        changedResource: { type: string, enum: [DRIVER, TRACTOR, TRAILER] }
        tractorId: { type: [string, "null"], format: uuid }
        expectedTrailerId: { type: [string, "null"], format: uuid }
        decision: { type: string, enum: [AUTHORIZE, REJECT] }
        affectedStopId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        locationId: { type: [string, "null"], format: uuid }
        siteSnapshot:
          $ref: '#/components/schemas/OrderDestinationSnapshot'
        scheduledAt: { type: [string, "null"], format: date-time }
        instructions: { type: [string, "null"] }
        reason: { type: string }
        stopVersion: { type: integer, format: int64, minimum: 0 }
        resolutionType:
          $ref: '#/components/schemas/TripCancellationResolutionTypeImplemented'
        destinationSiteId: { type: [string, "null"], format: uuid }
        safeResolutionFinished: { type: boolean }

    DriverUpdateImplemented:
      type: object
      additionalProperties: false
      required: [id, tripId, updateType, occurredAt, payload]
      properties:
        id: { type: string, format: uuid }
        tripId: { type: string, format: uuid }
        updateType:
          type: string
          enum: [TRIP_REROUTED, TRIP_CANCELLATION_STARTED, TRIP_CANCELLED, TRIP_CANCELLATION_FINISHED, TRIP_ASSIGNMENT_CHANGED, TRAILER_EXPECTATION_CHANGED]
        occurredAt: { type: string, format: date-time }
        payload:
          $ref: '#/components/schemas/DriverUpdatePayloadImplemented'

    DriverUpdatePageImplemented:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DriverUpdateImplemented'
        nextCursor: { type: [string, "null"] }

    TripAssignmentEventImplemented:
      type: object
      additionalProperties: false
      required: [id, eventType, driverId, tractorId, trailerId, actorUserId, occurredAt, reason, metadata]
      properties:
        id: { type: string, format: uuid }
        eventType:
          type: string
          enum: [DRIVER_ASSIGNED, DRIVER_REASSIGNED, TRACTOR_ASSIGNED, TRACTOR_REASSIGNED, TRAILER_PLANNED, TRAILER_SUBSTITUTION_AUTHORIZED, TRAILER_SUBSTITUTION_REJECTED]
        driverId: { type: [string, "null"], format: uuid }
        tractorId: { type: [string, "null"], format: uuid }
        trailerId: { type: [string, "null"], format: uuid }
        actorUserId: { type: [string, "null"], format: uuid }
        occurredAt: { type: string, format: date-time }
        reason: { type: [string, "null"] }
        metadata:
          type: [object, "null"]
          additionalProperties: false
          properties:
            previousDriverId: { type: string, format: uuid }
            previousTractorId: { type: string, format: uuid }
