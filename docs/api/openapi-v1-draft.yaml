        default: { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TrailerId:
      name: trailerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TenantId:
      name: tenantId
      in: path
      required: true
      description: Requested Tenant context; membership is always re-authorized server-side.
      schema: { type: string, format: uuid }
    CustomerId:
      name: customerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SiteId:
      name: siteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LocationId:
      name: locationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TripId:
      name: tripId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StopId:
      name: stopId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: Error response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PagedResponse:
      description: Cursor-paginated response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PagedResponse'

  schemas:
    AlertAcknowledgementRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    AlertResolutionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 4000, pattern: '\S' }
    AlertInboxPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/AlertOccurrence' } }
        nextCursor: { type: [string, 'null'] }
    AlertOccurrence:
      type: object
      additionalProperties: false
      required: [id, tenantId, alertType, severity, status, version, createdAt, acknowledgedBy, acknowledgedAt, resolvedBy, resolvedAt, resolutionReason, relatedEntityType, relatedResource, context, pushSummary, originActorType, resolutionActorType, detection, resolutionEvidence]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        alertType: { type: string, enum: [TRAILER_MISSING, STALE_TRAILER] }
        severity: { type: string, const: WARNING }
        status: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED] }
