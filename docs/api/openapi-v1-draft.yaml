        driverId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, pattern: '\S' }

    AssignTripTractorRequestImplemented:
      type: object
      additionalProperties: false
      required: [expectedVersion, tractorId, reason]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        tractorId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, pattern: '\S' }

    AssignTripTrailerRequestImplemented:
      type: object
      additionalProperties: false
