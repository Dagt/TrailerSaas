        key and identical request. Already uploaded documents never replace bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteUploadRequestImplemented' }
      responses:
        '200':
          description: Verified document metadata; replay preserves the saved logical result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentMetadataImplemented' }
        default: { $ref: '#/components/responses/Problem' }

