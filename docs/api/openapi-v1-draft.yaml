      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 4000, pattern: "\\S" }

    YardCheckMarkUnknownRequest:
      type: object
      additionalProperties: false
      required: [expectedTrailerVersion, reason]
      properties:
        expectedTrailerVersion: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 4000, pattern: "\\S" }

    YardCheckCorrectionRequest:
      type: object
      additionalProperties: false
      required: [expectedTrailerVersion, newLocationId, reason]
      properties:
        expectedTrailerVersion: { type: integer, format: int64, minimum: 0 }
        newLocationId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 4000, pattern: "\\S" }

    YardCheckSummary:
      type: object
      additionalProperties: false
      required: [id, siteId, locationId, status, version, startedByUserId, startedAt, completedByUserId, completedAt, cancelledByUserId, cancelledAt, cancellationReason, expectedCount, scannedCount, matchedCount, missingCount, unexpectedCount, mismatchCount, remainingCount, totalItemCount]
      properties:
        id: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        locationId: { type: [string, "null"], format: uuid }
        status: { type: string, enum: [IN_PROGRESS, COMPLETED, CANCELLED] }
        version: { type: integer, format: int64, minimum: 0 }
        startedByUserId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        completedByUserId: { type: [string, "null"], format: uuid }
        completedAt: { type: [string, "null"], format: date-time }
        cancelledByUserId: { type: [string, "null"], format: uuid }
        cancelledAt: { type: [string, "null"], format: date-time }
        cancellationReason: { type: [string, "null"] }
        expectedCount: { type: integer, format: int64, minimum: 0 }
        scannedCount: { type: integer, format: int64, minimum: 0 }
        matchedCount: { type: integer, format: int64, minimum: 0 }
        missingCount: { type: integer, format: int64, minimum: 0 }
        unexpectedCount: { type: integer, format: int64, minimum: 0 }
        mismatchCount: { type: integer, format: int64, minimum: 0 }
        remainingCount: { type: integer, format: int64, minimum: 0 }
        totalItemCount: { type: integer, format: int64, minimum: 0 }

    YardCheckRecordedSnapshot:
      type: object
      additionalProperties: false
      required: [operationalNumber, trailerVersion, locationState, currentLocationId, loadState, serviceabilityState, couplingState, lastKnownLocationId, lastSeenAt]
      properties:
        operationalNumber: { type: string }
        trailerVersion: { type: integer, format: int64, minimum: 0 }
        locationState: { type: string, enum: [AT_LOCATION, IN_TRANSIT, LOCATION_UNKNOWN] }
        currentLocationId: { type: [string, "null"], format: uuid }
        loadState: { type: string, enum: [EMPTY, LOADED, UNKNOWN] }
        serviceabilityState: { type: string, enum: [IN_SERVICE, OUT_OF_SERVICE] }
        couplingState: { type: string, enum: [COUPLED, UNCOUPLED] }
        lastKnownLocationId: { type: [string, "null"], format: uuid }
        lastSeenAt: { type: [string, "null"], format: date-time }
        locationName: { type: string }
        locationType: { type: string, enum: [YARD, DOCK] }
        siteName: { type: string }

    YardCheckItem:
      type: object
      additionalProperties: false
      required: [id, trailerId, expected, expectedLocationId, recordedSnapshot, found, result, observedLocationId, scannedAt, scannedByUserId, recordedAt, clientOperationId, reconciliationId]
      properties:
        id: { type: string, format: uuid }
        trailerId: { type: string, format: uuid }
        expected: { type: boolean }
        expectedLocationId: { type: [string, "null"], format: uuid }
        recordedSnapshot: { $ref: '#/components/schemas/YardCheckRecordedSnapshot' }
        found: { type: boolean }
        result: { type: [string, "null"], enum: [MATCHED, MISSING, UNEXPECTED, LOCATION_MISMATCH, null] }
        observedLocationId: { type: [string, "null"], format: uuid }
        scannedAt: { type: [string, "null"], format: date-time }
        scannedByUserId: { type: [string, "null"], format: uuid }
        recordedAt: { type: [string, "null"], format: date-time }
        clientOperationId: { type: [string, "null"], format: uuid }
        reconciliationId: { type: [string, "null"], format: uuid }

    YardCheckDetail:
      type: object
      additionalProperties: false
      required: [check, items, nextCursor, snapshotComplete]
      properties:
        check: { $ref: '#/components/schemas/YardCheckSummary' }
        items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/YardCheckItem' } }
        nextCursor: { type: [string, "null"], format: uuid }
        snapshotComplete: { type: boolean, description: "True only when this first page contains the entire selected item set. Otherwise all pages and unique-count validation are required before future offline use." }

    YardChecksPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/YardCheckSummary' } }
        nextCursor: { type: [string, "null"], format: uuid }

    YardCheckScanResult:
      type: object
      additionalProperties: false
      required: [outcome, check, item]
      properties:
        outcome: { type: string, enum: [MATCHED, UNEXPECTED, LOCATION_MISMATCH, ALREADY_SCANNED] }
        check: { $ref: '#/components/schemas/YardCheckSummary' }
        item: { $ref: '#/components/schemas/YardCheckItem' }

    YardCheckReconciliationResult:
      type: object
      additionalProperties: false
      required: [reconciliationId, yardCheckId, itemId, trailer, movementEvent, alertId]
      properties:
        reconciliationId: { type: string, format: uuid }
        yardCheckId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        trailer: { $ref: '#/components/schemas/YardTrailer' }
        movementEvent: { $ref: '#/components/schemas/YardCheckMovementEvent' }
        alertId: { type: [string, "null"], format: uuid }

    YardCheckMovementEvent:
      type: object
      additionalProperties: false
      required: [id, eventType, occurredAt, recordedAt]
      properties:
        id: { type: string, format: uuid }
        eventType: { type: string, enum: [LOCATION_MARKED_UNKNOWN, LOCATION_CORRECTED] }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }

    InitializeUploadRequest:
      type: object
      required: [documentType, contentType, sizeBytes]
      properties:
        documentType: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        checksumSha256: { type: [string, "null"] }

    InitializeUploadRequestImplemented:
      type: object
      additionalProperties: false
      required: [documentType, contentType, sizeBytes]
      properties:
        documentType:
          type: string
          enum: [BOL, POD, DELIVERY_PHOTO, PRETRIP_FRONT, PRETRIP_REAR, PRETRIP_DRIVER_SIDE, PRETRIP_PASSENGER_SIDE, DAMAGE_PHOTO, FUEL_RECEIPT]
          description: "#53: POD_UPLOAD for BOL/POD/DELIVERY_PHOTO; PRETRIP_CREATE for four Pre-Trip images; FUEL_EVENT_CREATE for receipts; EXCEPTION_REPORT for Driver damage. Active own Driver required on the generic route; #49 has a distinct scoped Trailer damage producer under TRAILER_OOS_MARK."
        contentType:
          type: string
          enum: [image/jpeg, image/png, application/pdf]
          description: PDF only for BOL/POD; photos require JPEG/PNG. No content sniffing/evidence approval claim.
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 104857600
          description: Deployment bound defaults to 25 MiB; configurable up to 100 MiB. Exact bytes verified.
        checksumSha256:
          type: [string, "null"]
          pattern: '^[0-9a-fA-F]{64}$'

    InitializeUploadResponseImplemented:
      type: object
      additionalProperties: false
      required: [documentId, uploadStatus, uploadUrl, expiresAt]
      properties:
        documentId: { type: string, format: uuid }
        uploadStatus: { type: string, enum: [PENDING] }
        uploadUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }

    CompleteUploadRequestImplemented:
      type: object
      additionalProperties: false
      properties:
        checksumSha256: { type: [string, "null"], pattern: '^[0-9a-fA-F]{64}$' }

    DocumentLinkRequestImplemented:
      type: object
      additionalProperties: false
      required: [entityType, entityId]
      properties:
        entityType: { type: string, enum: [TRIP_STOP, TRIP], description: "TRIP_STOP for delivery/Driver damage; TRIP for Pre-Trip/fuel/Driver damage. Trailer/OOS attachment is performed only by the #49 scoped producer, never this generic link request." }
        entityId: { type: string, format: uuid }

    DocumentLinkImplemented:
      type: object
      additionalProperties: false
      required: [id, entityType, entityId, createdAt]
      properties:
        id: { type: string, format: uuid }
        entityType: { type: string, enum: [TRIP_STOP, TRIP, TRAILER, INSPECTION], description: "INSPECTION is attached atomically by #43 and read through the own-inspection directory. TRAILER is exclusively attached by the #49 scoped damage producer. Public generic link requests accept only TRIP_STOP/TRIP." }
        entityId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    DocumentMetadataImplemented:
      type: object
      additionalProperties: false
      required: [id, documentType, contentType, sizeBytes, checksumSha256, uploadStatus, createdAt, uploadedAt, links]
      properties:
        id: { type: string, format: uuid }
        documentType:
          type: string
          enum: [BOL, POD, DELIVERY_PHOTO, PRETRIP_FRONT, PRETRIP_REAR, PRETRIP_DRIVER_SIDE, PRETRIP_PASSENGER_SIDE, DAMAGE_PHOTO, FUEL_RECEIPT]
        contentType: { type: [string, "null"] }
        sizeBytes: { type: [integer, "null"], format: int64 }
        checksumSha256: { type: [string, "null"] }
        uploadStatus: { type: string, enum: [PENDING, UPLOADED, FAILED, DELETED_BY_RETENTION] }
        createdAt: { type: string, format: date-time }
        uploadedAt: { type: [string, "null"], format: date-time }
        links:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/DocumentLinkImplemented' }

    DocumentDownloadImplemented:
      type: object
      additionalProperties: false
      required: [downloadUrl, expiresAt]
      properties:
        downloadUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }

    InitializeUploadResponse:
      type: object
      properties:
        documentId: { type: string, format: uuid }
        uploadStatus: { type: string }
        uploadUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
