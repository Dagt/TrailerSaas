        belongs to that exact Site. Site and frozen snapshot may coexist. Without Site, meaningful
        frozen snapshot is required and Location must be null. orderIds may be empty for operational
        visits. No public orderStopId or inferred requested-Stop matching. BASE_RETURN is explicit.
      properties:
        sequenceNumber: { type: integer, minimum: 1 }
        stopType:
          $ref: '#/components/schemas/ExecutableStopTypeImplemented'
        siteId: { type: [string, "null"], format: uuid }
        locationId: { type: [string, "null"], format: uuid }
        siteSnapshot:
          anyOf:
            - $ref: '#/components/schemas/OrderDestinationSnapshot'
            - type: "null"
        scheduledAt: { type: [string, "null"], format: date-time }
        orderIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        instructions: { type: [string, "null"] }

    CreateTripRequestImplemented:
      type: object
      additionalProperties: false
      required: [orderIds, stops]
      description: >
        Every Stop Order must belong to the top-level set, and their union must cover exactly that
        set. An Order may appear at multiple executable Stops or Trips. Optional IDs require their
        respective TRIP_ASSIGN_DRIVER, TRIP_ASSIGN_TRACTOR or TRIP_ASSIGN_TRAILER capability.
      properties:
        orderIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
        stops:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TripStopInputImplemented'
        driverId: { type: [string, "null"], format: uuid }
        tractorId: { type: [string, "null"], format: uuid }
        plannedInitialTrailerId: { type: [string, "null"], format: uuid }

    TripSummaryImplemented:
      type: object
      additionalProperties: false
      required: [id, status, currentDriverId, currentTractorId, plannedInitialTrailerId, version, createdAt, updatedAt, startedAt, completedAt, cancelledAt]
      properties:
        id: { type: string, format: uuid }
        status:
          $ref: '#/components/schemas/TripStatusImplemented'
        currentDriverId: { type: [string, "null"], format: uuid }
        currentTractorId: { type: [string, "null"], format: uuid }
        plannedInitialTrailerId: { type: [string, "null"], format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        cancelledAt: { type: [string, "null"], format: date-time }

    AssignTripDriverRequestImplemented:
      type: object
      additionalProperties: false
      required: [expectedVersion, driverId, reason]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        driverId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, pattern: '\S' }

    AssignTripTractorRequestImplemented:
      type: object
      additionalProperties: false
      required: [expectedVersion, tractorId, reason]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        tractorId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, pattern: '\S' }

    AssignTripTrailerRequestImplemented:
      type: object
      additionalProperties: false
      required: [expectedVersion, trailerId, reason]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        trailerId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, pattern: '\S' }

    TrailerSubstitutionDecisionRequestImplemented:
      type: object
      additionalProperties: false
