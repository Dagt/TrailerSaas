openapi: 3.1.0
info:
  title: TrailerSaaS API
  version: 1.0.0-draft
  description: >
    Draft OpenAPI skeleton derived from the accepted MVP requirements, state machines,
    UX flows and schema v1.0. Operation-specific behavior remains defined by the
    markdown API contract documents until this specification is fully expanded.
servers: []
security:
  - firebaseBearer: []

tags:
  - name: Identity
  - name: Memberships
  - name: Settings
  - name: Customers
  - name: Sites
  - name: Drivers
  - name: Tractors
  - name: Trailers
  - name: Orders
  - name: Trips
  - name: DriverMobile
  - name: Yard
  - name: Documents
  - name: Alerts
  - name: Audit

paths:
  /api/v1/me:
    get:
      tags: [Identity]
      operationId: getCurrentUserContext
      description: >
        Firebase ID-token authentication resolves the global internal User.
        Lists only that User's persisted memberships and roles from PostgreSQL.
        This bootstrap directory does not grant Tenant access or capabilities.
      responses:
        '200':
          description: Current authenticated User and memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserContext'
        '401':
          description: A valid Firebase ID token is required; AUTHENTICATION_REQUIRED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.trailersaas.example/problems/authentication-required
                title: Authentication required
                status: 401
                code: AUTHENTICATION_REQUIRED
                detail: A valid authentication token is required.
                traceId: request-or-trace-id
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/invitations:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [Identity]
      operationId: createMembershipInvitation
      description: >
        USER_INVITE. Server expiry is exactly seven days after creation. Returns
        acceptanceToken once; only SHA-256 is stored. No email delivery yet.
        Duplicate live PENDING Tenant/normalized email returns RESOURCE_CONFLICT;
        stale PENDING transitions to EXPIRED before re-inviting.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvitationRequest' }
      responses:
        '201':
          description: Invitation created with one-time raw token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateInvitationResponse' }
        default:
          $ref: '#/components/responses/Problem'
    get:
      tags: [Identity]
      operationId: listMembershipInvitations
      description: USER_INVITE. Ordered by createdAt DESC, id. No token/hash; unsupported query parameters rejected.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/InvitationStatus' }
      responses:
        '200':
          description: Invitation summaries with intended roles
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/InvitationSummary' }
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/invitations/{invitationId}/revoke:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Identity]
      operationId: revokeMembershipInvitation
      description: >
        USER_INVITE. PENDING becomes REVOKED, or EXPIRED if already expired.
        REVOKED is idempotent; ACCEPTED returns RESOURCE_CONFLICT.
        Preserves intended roles and history. Never returns token/hash.
      responses:
        '200':
          description: Current invitation summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationSummary' }
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/invitations/accept:
    post:
      tags: [Identity]
      operationId: acceptMembershipInvitation
      description: >
        Global Firebase-authenticated onboarding. Tenant derives solely from the
        locked invitation. Requires the current verified Firebase email to match
        trim+lowercase invited email; users.email is not authoritative. Atomic
        ACTIVE membership and exact intended roles. Same-User retries return the
        existing result without reactivating membership or replacing roles.
        No role merge into an existing membership and no email delivery.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInvitationRequest' }
      responses:
        '200':
          description: Accepted or same-User idempotent replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationAcceptanceResult' }
        '400':
          description: Invalid body or noncanonical 32-byte token encoding; VALIDATION_FAILED.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: INVITATION_NOT_ACCEPTABLE for every syntactically valid but unacceptable invitation; no condition/existence disclosure.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.trailersaas.example/problems/invitation-not-acceptable
                title: Conflict
                status: 409
                code: INVITATION_NOT_ACCEPTABLE
                detail: The invitation cannot be accepted.
                traceId: request-or-trace-id
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/settings:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Settings]
      operationId: getTenantSettings
      responses:
        '200':
          description: Tenant settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettings'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Settings]
      operationId: updateTenantSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer, format: int64 }
                staleTrailerThresholdHours: { type: integer }
                defaultTimezone: { type: string }
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettings'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/customers:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Customers]
      operationId: listCustomers
      description: CUSTOMER_VIEW. Ordered by name/id; Customer-scoped readers receive only their Customers. No query filters or cursor in this master-data baseline.
      responses:
        '200':
          description: Scoped Customer list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Customers]
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/customers/{customerId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [Customers]
      operationId: getCustomer
      description: CUSTOMER_VIEW. A Customer-scoped target outside grants returns CUSTOMER_SCOPE_DENIED without revealing existence.
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Customers]
      operationId: updateCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Updated Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          $ref: '#/components/responses/Problem'


  /api/v1/tenants/{tenantId}/sites:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Sites]
      operationId: listSites
      description: SITE_VIEW. Tenant-wide readers see all; Customer readers see associated Sites only.
      responses:
        '200':
          description: Scoped master data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalSiteList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Sites]
      operationId: createSite
      description: SITE_CREATE Tenant-wide. Defaults active=true, version=0.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteRequest'
      responses:
        '201':
          description: Resource created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalSite'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/sites/{siteId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/SiteId'
    get:
      tags: [Sites]
      operationId: getSite
      description: SITE_VIEW. Sites outside Customer scope or Tenant return RESOURCE_NOT_FOUND.
      responses:
        '200':
          description: Scoped master data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalSite'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Sites]
      operationId: updateSite
      description: SITE_EDIT Tenant-wide. expectedVersion is required; stale writes return STALE_VERSION.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteRequest'
      responses:
        '200':
          description: Updated resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalSite'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/customers/{customerId}/sites:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CustomerId'
    post:
      tags: [Sites]
      operationId: associateCustomerSite
      description: CUSTOMER_EDIT Tenant-wide. Duplicate association returns RESOURCE_CONFLICT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssociateCustomerSiteRequest'
      responses:
        '201':
          description: Resource created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSite'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/customers/{customerId}/sites/{siteId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CustomerId'
      - $ref: '#/components/parameters/SiteId'
    delete:
      tags: [Sites]
      operationId: removeCustomerSiteAssociation
      description: CUSTOMER_EDIT Tenant-wide. Active Customer Locations prevent removal (RESOURCE_CONFLICT). Inactive history remains.
      responses:
        '204':
          description: Association removed
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/sites/{siteId}/locations:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/SiteId'
    get:
      tags: [Sites]
      operationId: listOperationalLocations
      description: SITE_VIEW. Customer readers see only their Customer Locations, never neutral Locations.
      responses:
        '200':
          description: Scoped master data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalLocationList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Sites]
      operationId: createOperationalLocation
      description: SITE_CREATE Tenant-wide. Customer-specific Locations require an existing Customer-Site association.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOperationalLocationRequest'
      responses:
        '201':
          description: Resource created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalLocation'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/locations/{locationId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/LocationId'
    patch:
      tags: [Sites]
      operationId: updateOperationalLocation
      description: SITE_EDIT Tenant-wide. Site is immutable. Reactivation or Customer change revalidates the association.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOperationalLocationRequest'
      responses:
        '200':
          description: Updated resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalLocation'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/drivers:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Drivers]
      operationId: listDrivers
      description: >
        DRIVER_VIEW. Tenant-wide Admin/Transport Operations reads. Ordered by name/id, without pagination or query filters. Unknown query parameters return VALIDATION_FAILED.
      responses:
        '200':
          description: DriverList
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Drivers]
      operationId: createDriver
      description: >
        DRIVER_CREATE. Admin-only. Server sets active=true and version=0. A Driver may exist without a User; userId cannot be set here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDriverRequest'
      responses:
        '201':
          description: Driver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/drivers/{driverId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: driverId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Drivers]
      operationId: getDriver
      description: >
        DRIVER_VIEW. A nonexistent/cross-Tenant resource returns RESOURCE_NOT_FOUND after Tenant authorization.
      responses:
        '200':
          description: Driver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Drivers]
      operationId: updateDriver
      description: >
        DRIVER_EDIT. Admin-only. Omitted fields remain unchanged; no-op PATCH retains version. Stale expectedVersion or optimistic races return STALE_VERSION. active=false deactivates; active=true reactivates. Explicit null clears licenseNumber/medicalCertificateExpires; userId changes only via user-link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDriverRequest'
      responses:
        '200':
          description: Driver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/drivers/{driverId}/user-link:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: driverId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Drivers]
      operationId: linkDriverUser
      description: >
        DRIVER_EDIT. Requires fresh same-Tenant ACTIVE membership and TENANT DRIVER role for the target User. Existing Driver link, ineligible target, or another Driver linked to this User in the same Tenant returns generic RESOURCE_CONFLICT. Never creates membership/roles or replaces an existing link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkDriverUserRequest'
      responses:
        '200':
          description: Driver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Drivers]
      operationId: unlinkDriverUser
      description: >
        DRIVER_EDIT. The JSON request body is required, including expectedVersion. Removes only the operational User link. If already null and the version matches, returns 204 without incrementing version; a removed link increments version. Preserves User/membership/roles/history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnlinkDriverUserRequest'
      responses:
        '204':
          description: Link removed; no content
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/tractors:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Tractors]
      operationId: listTractors
      description: >
        TRACTOR_VIEW. Tenant-wide Admin/Transport Operations reads. Ordered by normalized number/id, without pagination or query filters. Unknown query parameters return VALIDATION_FAILED.
      responses:
        '200':
          description: TractorList
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TractorList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Tractors]
      operationId: createTractor
      description: >
        TRACTOR_CREATE. Admin-only. Server sets active=true and version=0. Preserves the original display number; tenant-normalized collisions return RESOURCE_CONFLICT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTractorRequest'
      responses:
        '201':
          description: Tractor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tractor'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/tractors/{tractorId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: tractorId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Tractors]
      operationId: getTractor
      description: >
        TRACTOR_VIEW. A nonexistent/cross-Tenant resource returns RESOURCE_NOT_FOUND after Tenant authorization.
      responses:
        '200':
          description: Tractor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tractor'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Tractors]
      operationId: updateTractor
      description: >
        TRACTOR_EDIT. Admin-only. Omitted fields remain unchanged; no-op PATCH retains version. Stale expectedVersion or optimistic races return STALE_VERSION. active=false deactivates; active=true reactivates. Number changes revalidate controls and DB-normalized uniqueness.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTractorRequest'
      responses:
        '200':
          description: Tractor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tractor'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/orders:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Orders]
      operationId: listOrders
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: customerId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/PagedResponse'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Orders]
      operationId: createOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSummary'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Orders]
      operationId: getOrder
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSummary'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Orders]
      operationId: updateOrderBeforeExecution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer, format: int64 }
                poNumber: { type: [string, "null"] }
                shipmentNumber: { type: [string, "null"] }
                bolReference: { type: [string, "null"] }
      responses:
        '200':
          description: Updated Order
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/orders/{orderId}/cancellations:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/IdempotencyKeyOptional'
    post:
      tags: [Orders]
      operationId: cancelOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '200':
          description: Updated Order state
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/trips:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Trips]
      operationId: listTrips
      responses:
        '200':
          $ref: '#/components/responses/PagedResponse'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Trips]
      operationId: createTrip
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '201':
          description: Trip created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripSummary'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/trips/{tripId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/TripId'
    get:
      tags: [Trips]
      operationId: getTrip
      responses:
        '200':
          description: Trip detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripSummary'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/trips/{tripId}/hooks:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/TripId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [DriverMobile]
      operationId: hookTrailer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HookTrailerRequest'
      responses:
        '200':
          description: Trailer hooked
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/stops/{stopId}/arrivals:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/StopId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [DriverMobile]
      operationId: confirmStopArrival
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArrivalRequest'
      responses:
        '200':
          description: Arrival recorded
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/stops/{stopId}/delivery-completions:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/StopId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [DriverMobile]
      operationId: completeDeliveryStop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryCompletionRequest'
      responses:
        '200':
          description: Delivery completed
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/yard-checks:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Yard]
      operationId: listYardChecks
      responses:
        '200':
          $ref: '#/components/responses/PagedResponse'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Yard]
      operationId: startYardCheck
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartYardCheckRequest'
      responses:
        '201':
          description: Yard Check started
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/yard-checks/{yardCheckId}/scans:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: yardCheckId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Yard]
      operationId: scanYardCheckTrailer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YardCheckScanRequest'
      responses:
        '200':
          description: Scan result
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/documents/uploads:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [Documents]
      operationId: initializeDocumentUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitializeUploadRequest'
      responses:
        '201':
          description: Upload initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitializeUploadResponse'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/alerts:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Alerts]
      operationId: listAlerts
      responses:
        '200':
          $ref: '#/components/responses/PagedResponse'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/tenants/{tenantId}/audit-events:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Audit]
      operationId: listAuditEvents
      responses:
        '200':
          $ref: '#/components/responses/PagedResponse'
        default:
          $ref: '#/components/responses/Problem'

components:
  securitySchemes:
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      description: Requested Tenant context; membership is always re-authorized server-side.
      schema: { type: string, format: uuid }
    CustomerId:
      name: customerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SiteId:
      name: siteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LocationId:
      name: locationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TripId:
      name: tripId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StopId:
      name: stopId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: Error response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PagedResponse:
      description: Cursor-paginated response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PagedResponse'

  schemas:
    Problem:
      type: object
      required: [title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        traceId: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    PagedResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type: [string, "null"]

    CurrentUserContext:
      type: object
      required: [userId, email, displayName, memberships]
      properties:
        userId: { type: string, format: uuid }
        email: { type: [string, "null"] }
        displayName: { type: [string, "null"] }
        memberships:
          type: array
          items:
            type: object
            required: [tenantId, tenantName, status, roles]
            properties:
              tenantId: { type: string, format: uuid }
              tenantName: { type: string }
              status:
                type: string
                enum: [ACTIVE, SUSPENDED, DISABLED]
              roles:
                type: array
                items:
                  type: object
                  required: [roleCode, scopeType, customerId]
                  properties:
                    roleCode:
                      type: string
                      enum: [TENANT_ADMIN, TRANSPORT_OPERATIONS, CUSTOMER_DISPATCHER, YARD_SPOTTER, DRIVER]
                    scopeType:
                      type: string
                      enum: [TENANT, CUSTOMER]
                    customerId: { type: [string, "null"], format: uuid }

    InvitationStatus:
      type: string
      enum: [PENDING, ACCEPTED, EXPIRED, REVOKED]

    InvitationRole:
      type: object
      additionalProperties: false
      required: [roleCode, scopeType]
      description: CUSTOMER_DISPATCHER requires CUSTOMER/non-null customerId; all other roles require TENANT/null customerId. Duplicate intended assignments rejected.
      properties:
        roleCode:
          type: string
          enum: [TENANT_ADMIN, TRANSPORT_OPERATIONS, CUSTOMER_DISPATCHER, YARD_SPOTTER, DRIVER]
        scopeType:
          type: string
          enum: [TENANT, CUSTOMER]
        customerId: { type: [string, "null"], format: uuid }

    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, roles]
      properties:
        email: { type: string, description: 'Original display email; normalized with trim and whole-email lowercase, without provider aliases' }
        displayName: { type: [string, "null"] }
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/InvitationRole' }

    InvitationSummary:
      type: object
      additionalProperties: false
      required: [id, email, displayName, status, expiresAt, roles]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: [string, "null"] }
        status: { $ref: '#/components/schemas/InvitationStatus' }
        expiresAt: { type: string, format: date-time }
        roles:
          type: array
          items: { $ref: '#/components/schemas/InvitationRole' }

    CreateInvitationResponse:
      type: object
      additionalProperties: false
      required: [id, email, displayName, status, expiresAt, roles, acceptanceToken]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: [string, "null"] }
        status: { $ref: '#/components/schemas/InvitationStatus' }
        expiresAt: { type: string, format: date-time }
        roles:
          type: array
          items: { $ref: '#/components/schemas/InvitationRole' }
        acceptanceToken:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: 32 random bytes encoded Base64 URL-safe without padding; returned only once at creation. Never in list/revoke or persisted.

    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Canonical unpadded Base64 URL-safe encoding of exactly 32 bytes. No Tenant/User/email/role hints accepted.

    InvitationAcceptanceResult:
      type: object
      additionalProperties: false
      required: [invitationId, tenantId, membershipId, accepted]
      properties:
        invitationId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        membershipId: { type: string, format: uuid }
        accepted: { type: boolean, const: true }

    TenantSettings:
      type: object
      properties:
        staleTrailerThresholdHours: { type: integer }
        defaultTimezone: { type: [string, "null"] }
        version: { type: integer, format: int64 }

    CreateCustomerRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, description: Nonblank Customer name }

    UpdateCustomerRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        name: { type: string, minLength: 1 }
        status:
          type: string
          enum: [ACTIVE, INACTIVE]

    Customer:
      type: object
      required: [id, name, status, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CustomerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Customer' }

    SiteAddress:
      type: [object, "null"]
      properties:
        line1: { type: [string, "null"] }
        line2: { type: [string, "null"] }
        city: { type: [string, "null"] }
        stateRegion: { type: [string, "null"] }
        postalCode: { type: [string, "null"] }
        countryCode: { type: [string, "null"], minLength: 2, maxLength: 2 }

    CreateSiteRequest:
      type: object
      required: [name, timezone]
      properties:
        name: { type: string, minLength: 1 }
        address: { $ref: '#/components/schemas/SiteAddress' }
        timezone: { type: string, description: Valid IANA timezone }
        latitude: { type: [number, "null"], minimum: -90, maximum: 90 }
        longitude: { type: [number, "null"], minimum: -180, maximum: 180 }
        geofenceRadiusM: { type: [integer, "null"], minimum: 1, maximum: 2147483647 }

    UpdateSiteRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      description: Omitted fields remain unchanged; null clears nullable fields. Address object updates only provided subfields; null clears the whole address.
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        name: { type: string, minLength: 1 }
        address: { $ref: '#/components/schemas/SiteAddress' }
        timezone: { type: string, description: Valid IANA timezone }
        latitude: { type: [number, "null"], minimum: -90, maximum: 90 }
        longitude: { type: [number, "null"], minimum: -180, maximum: 180 }
        geofenceRadiusM: { type: [integer, "null"], minimum: 1, maximum: 2147483647 }
        active: { type: boolean }

    PhysicalSite:
      allOf:
        - $ref: '#/components/schemas/CreateSiteRequest'
        - type: object
          required: [id, active, version, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            active: { type: boolean }
            version: { type: integer, format: int64 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    PhysicalSiteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PhysicalSite' }

    AssociateCustomerSiteRequest:
      type: object
      required: [siteId]
      properties:
        siteId: { type: string, format: uuid }

    CustomerSite:
      type: object
      required: [id, customerId, siteId, createdAt]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    CreateOperationalLocationRequest:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1 }
        type: { type: string, enum: [BASE, YARD, DOCK, CUSTOMER_AREA, SHOP, OTHER] }
        code: { type: [string, "null"] }
        customerId: { type: [string, "null"], format: uuid }

    UpdateOperationalLocationRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      description: siteId is immutable. Null clears code/customerId; omitted fields stay unchanged.
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        name: { type: string, minLength: 1 }
        type: { type: string, enum: [BASE, YARD, DOCK, CUSTOMER_AREA, SHOP, OTHER] }
        code: { type: [string, "null"] }
        customerId: { type: [string, "null"], format: uuid }
        active: { type: boolean }

    OperationalLocation:
      allOf:
        - $ref: '#/components/schemas/CreateOperationalLocationRequest'
        - type: object
          required: [id, siteId, customerId, code, active, version, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            siteId: { type: string, format: uuid }
            active: { type: boolean }
            version: { type: integer, format: int64 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    OperationalLocationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OperationalLocation' }

    Driver:
      type: object
      additionalProperties: false
      required: [id, userId, name, licenseNumber, medicalCertificateExpires, active, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: [string, "null"], format: uuid }
        name: { type: string }
        licenseNumber: { type: [string, "null"] }
        medicalCertificateExpires: { type: [string, "null"], format: date }
        active: { type: boolean }
        version: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DriverList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Driver' }
    CreateDriverRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, pattern: '\S' }
        licenseNumber: { type: [string, "null"] }
        medicalCertificateExpires: { type: [string, "null"], format: date }
    UpdateDriverRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        name: { type: string, minLength: 1, pattern: '\S' }
        licenseNumber: { type: [string, "null"] }
        medicalCertificateExpires: { type: [string, "null"], format: date }
        active: { type: boolean }
    LinkDriverUserRequest:
      type: object
      additionalProperties: false
      required: [userId, expectedVersion]
      properties:
        userId: { type: string, format: uuid }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    UnlinkDriverUserRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    Tractor:
      type: object
      additionalProperties: false
      required: [id, operationalNumber, active, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        operationalNumber: { type: string }
        active: { type: boolean }
        version: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TractorList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Tractor' }
    CreateTractorRequest:
      type: object
      additionalProperties: false
      required: [operationalNumber]
      properties:
        operationalNumber:
          type: string
          minLength: 1
          pattern: '^[^\u0000-\u001f\u007f-\u009f]*[^ \u0000-\u001f\u007f-\u009f][^\u0000-\u001f\u007f-\u009f]*$'
          description: >
            Display preserved exactly. Rejects C0/C1 controls and all-ASCII-space values.
            Uniqueness uses ASCII-space trim/collapse and ASCII a-z to A-Z only;
            punctuation, leading zeros, separators and non-ASCII are preserved.
    UpdateTractorRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        operationalNumber:
          $ref: '#/components/schemas/CreateTractorRequest/properties/operationalNumber'
        active: { type: boolean }

    CargoLineInput:
      type: object
      required: [description]
      properties:
        description: { type: string }
        quantity: { type: number }
        palletCount: { type: integer }
        weight: { type: number }
        weightUnit: { type: string }

    RequestedStopInput:
      type: object
      required: [sequenceNumber, stopType]
      properties:
        sequenceNumber: { type: integer, minimum: 1 }
        siteId: { type: [string, "null"], format: uuid }
        locationId: { type: [string, "null"], format: uuid }
        siteSnapshot: { type: [object, "null"] }
        stopType: { type: string }
        scheduledAt: { type: [string, "null"], format: date-time }
        instructions: { type: [string, "null"] }

    CreateOrderRequest:
      type: object
      required: [customerId, orderNumber, requestedStops]
      properties:
        customerId: { type: string, format: uuid }
        orderNumber: { type: string }
        poNumber: { type: [string, "null"] }
        shipmentNumber: { type: [string, "null"] }
        bolReference: { type: [string, "null"] }
        cargoLines:
          type: array
          items:
            $ref: '#/components/schemas/CargoLineInput'
        requestedStops:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RequestedStopInput'
        plannedTrailerId: { type: [string, "null"], format: uuid }

    OrderSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        orderNumber: { type: string }
        status: { type: string }
        version: { type: integer, format: int64 }

    CancelOrderRequest:
      type: object
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, format: int64 }
        reason: { type: string }
        resolution:
          type: [object, "null"]

    TripStopInput:
      type: object
      required: [sequenceNumber, stopType, orderIds]
      properties:
        sequenceNumber: { type: integer }
        stopType: { type: string }
        siteId: { type: [string, "null"], format: uuid }
        locationId: { type: [string, "null"], format: uuid }
        siteSnapshot: { type: [object, "null"] }
        scheduledAt: { type: [string, "null"], format: date-time }
        orderIds:
          type: array
          items: { type: string, format: uuid }
        instructions: { type: [string, "null"] }

    CreateTripRequest:
      type: object
      required: [orderIds, stops]
      properties:
        orderIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        stops:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TripStopInput'
        driverId: { type: [string, "null"], format: uuid }
        tractorId: { type: [string, "null"], format: uuid }
        plannedInitialTrailerId: { type: [string, "null"], format: uuid }

    TripSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        currentDriverId: { type: [string, "null"], format: uuid }
        currentTractorId: { type: [string, "null"], format: uuid }
        plannedInitialTrailerId: { type: [string, "null"], format: uuid }
        version: { type: integer, format: int64 }

    HookTrailerRequest:
      type: object
      required: [trailerId, tractorId, driverId, occurredAt, expectedTrailerVersion]
      properties:
        trailerId: { type: string, format: uuid }
        tractorId: { type: string, format: uuid }
        driverId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        expectedTrailerVersion: { type: integer, format: int64 }

    ArrivalRequest:
      type: object
      required: [occurredAt, source]
      properties:
        occurredAt: { type: string, format: date-time }
        source:
          type: string
          enum: [MANUAL, GEOFENCE_CONFIRMED]
        coordinates:
          type: [object, "null"]
          properties:
            latitude: { type: number }
            longitude: { type: number }
            accuracyM: { type: number }

    DeliveryCompletionRequest:
      oneOf:
        - type: object
          required: [evidenceMode, bolDocumentId, occurredAt]
          properties:
            evidenceMode:
              type: string
              const: SIGNED_BOL
            bolDocumentId: { type: string, format: uuid }
            occurredAt: { type: string, format: date-time }
        - type: object
          required: [evidenceMode, bolDocumentId, deliveryPhotoDocumentId, comment, occurredAt]
          properties:
            evidenceMode:
              type: string
              const: NO_RECEIVER_AVAILABLE
            bolDocumentId: { type: string, format: uuid }
            deliveryPhotoDocumentId: { type: string, format: uuid }
            comment: { type: string, minLength: 1 }
            occurredAt: { type: string, format: date-time }

    StartYardCheckRequest:
      type: object
      required: [siteId]
      properties:
        siteId: { type: string, format: uuid }
        locationId: { type: [string, "null"], format: uuid }

    YardCheckScanRequest:
      type: object
      required: [trailerId, scannedAt]
      properties:
        trailerId: { type: string, format: uuid }
        observedLocationId: { type: [string, "null"], format: uuid }
        scannedAt: { type: string, format: date-time }

    InitializeUploadRequest:
      type: object
      required: [documentType, contentType, sizeBytes]
      properties:
        documentType: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        checksumSha256: { type: [string, "null"] }

    InitializeUploadResponse:
      type: object
      properties:
        documentId: { type: string, format: uuid }
        uploadStatus: { type: string }
        uploadUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
