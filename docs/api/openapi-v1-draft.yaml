        requires an active Trailer AT_LOCATION with normalized currentLocationId.
        STALE_TRAILER requires a valid nonfuture last_seen_at within the current Tenant
        threshold; physical freshness may recover in transit. Scheduled stale recovery
        is an internal SYSTEM operation with a live scoped durable job, not this human API.
