      operationId: resolveAlert
      x-implementation-status: implemented-issue-56
      description: >-
        Fresh ALERT_RESOLVE plus ALERT_VIEW, ACTIVE membership/Tenant and related
        Trailer/Customer scope. Write capability role grants remain unassigned pending
